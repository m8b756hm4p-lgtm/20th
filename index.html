
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18131c">
  <title>Happy Birthday</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #18131c;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Hiragino Kaku Gothic ProN", sans-serif;
    }

    button, input {
      font: inherit;
    }

    /* 背景動画 */
    #background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #18131c;
    }

    #background-shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(20, 10, 25, 0.2);
      pointer-events: none;
    }

    /* パスコード画面 */
    #passcode-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      padding-top: max(28px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      color: white;
      text-align: center;
      background: rgba(24, 19, 28, 0.48);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transition: opacity 0.65s ease;
    }

    #passcode-screen.unlocked {
      opacity: 0;
      pointer-events: none;
    }

    .lock-content {
      width: min(100%, 330px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lock-heart {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,0.48);
      border-radius: 50%;
      background: rgba(255,255,255,0.09);
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 300;
    }

    .lock-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 0.06em;
    }

    .lock-subtitle {
      margin: 10px 0 0;
      color: rgba(255,255,255,0.83);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    /* 4つの入力ドット */
    #passcode-dots {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0 22px;
    }

    .passcode-dot {
      width: 11px;
      height: 11px;
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 50%;
      background: transparent;
      transition: background 0.15s, transform 0.15s;
    }

    .passcode-dot.filled {
      background: white;
      transform: scale(1.08);
    }

    #passcode-error {
      min-height: 20px;
      margin: 0 0 8px;
      color: #ffe0eb;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0;
    }

    #passcode-error.show {
      opacity: 1;
    }

    /* 数字キーパッド */
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 68px);
      grid-template-rows: repeat(4, 60px);
      gap: 12px 18px;
      justify-content: center;
      margin-top: 2px;
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 60px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 25px;
      font-weight: 300;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }

    .key:active {
      background: rgba(255,255,255,0.36);
      transform: scale(0.94);
    }

    .key-empty {
      visibility: hidden;
      pointer-events: none;
    }

    .key-delete {
      border: none;
      background: transparent;
      font-size: 21px;
    }

    .lock-hint {
      margin: 22px 0 0;
      color: rgba(255,255,255,0.7);
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    #passcode-dots.shake {
      animation: shake 0.35s ease;
    }

    /* 封筒画面 */
    #envelope-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }

    #envelope-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #envelope-screen.opening {
      opacity: 0;
      pointer-events: none;
    }

    #envelope-button {
      display: block;
      width: min(75vw, 340px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: float 2.5s ease-in-out infinite;
    }

    #envelope-button img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
    }

    #envelope-caption {
      margin: 0;
      color: white;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-shadow: 0 2px 8px #000;
    }

    #envelope-error {
      display: none;
      max-width: 300px;
      color: white;
      font-size: 13px;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    /* 本の画面 */
    #book-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 12px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #book-screen.visible {
      opacity: 1;
    }

    #book-frame {
      position: relative;
      flex: 0 0 auto;
      width: min(96vw, 900px, 120vh);
      aspect-ratio: 2.5 / 1;
      max-height: 48vh;
      transition: transform 0.55s ease;
    }

    #book {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0 auto;
    }

    #book .page {
      background: #fff;
      overflow: hidden;
    }

    #book .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #book .stf__parent {
      margin: 0 auto !important;
    }

    #book-screen.front-cover #book-frame {
      transform: translateX(calc(min(96vw, 900px, 120vh) / -4));
    }

    #book-screen.back-cover #book-frame {
      transform: translateX(calc(min(96vw, 900px, 120vh) / 4));
    }

    /* 音楽ボタン */
    #music-button {
      position: fixed;
      right: 16px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      color: white;
      background: rgba(35, 25, 40, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* 音楽プレイヤー */
    #music-panel {
      position: fixed;
      right: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 11;
      width: min(340px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.25);
      display: none;
    }

    #music-panel.open {
      display: block;
    }

    #music-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #514455;
      font-size: 13px;
    }

    #music-close {
      border: none;
      background: transparent;
      color: #514455;
      font-size: 20px;
      cursor: pointer;
    }

    #music-player {
      display: block;
      width: 100%;
      height: 150px;
      border: 0;
      border-radius: 8px;
    }

    @media (max-height: 650px) {
      #passcode-screen {
        overflow-y: auto;
        justify-content: flex-start;
      }

      .lock-content {
        margin: auto 0;
      }

      .lock-heart {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        font-size: 27px;
      }

      .lock-title {
        font-size: 23px;
      }

      #passcode-dots {
        margin: 18px 0 12px;
      }

      #keypad {
        grid-template-rows: repeat(4, 48px);
        gap: 8px 16px;
      }

      .key {
        width: 56px;
        height: 48px;
        font-size: 22px;
      }

      .lock-hint {
        margin-top: 12px;
      }

      #book-frame {
        width: min(96vw, 130vh, 900px);
        max-height: 70vh;
      }

      #envelope-button {
        width: min(45vw, 250px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #envelope-button {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- 背景動画 -->
  <video id="background-video" autoplay muted loop playsinline>
    <source src="./background.mp4.MP4" type="video/mp4">
  </video>

  <div id="background-shade"></div>

  <!-- スマホ風パスコード画面 -->
  <section id="passcode-screen">
    <div class="lock-content">


      <div id="passcode-dots" aria-label="4桁の入力状況">
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
      </div>

      <p id="passcode-error" role="status" aria-live="polite">
        パスコードが違うみたい
      </p>

      <div id="keypad" aria-label="数字キーパッド">
        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>

        <button class="key key-empty" type="button" tabindex="-1" aria-hidden="true"></button>
        <button class="key" type="button" data-digit="0">0</button>
        <button class="key key-delete" type="button" id="delete-digit" aria-label="1桁削除">⌫</button>
      </div>

      <p class="lock-hint">MADE WITH LOVE ♡</p>
    </div>
  </section>

  <!-- 封筒 -->
  <section id="envelope-screen">
    <button id="envelope-button" aria-label="手紙を開く">
      <img
        src="./envelope.png.PNG"
        alt="封筒"
        onerror="this.style.display='none'; document.getElementById('envelope-error').style.display='block';"
      >
    </button>

    <p id="envelope-caption">Tap to open</p>

    <p id="envelope-error">
      封筒画像を読み込めません。
      GitHub上のファイル名を確認してください。
    </p>
  </section>

  <!-- 本 -->
  <section id="book-screen">
    <div id="book-frame">
      <div id="book">

        <div class="page" data-density="hard">
          <img src="./page1.jpg.JPG" alt="表紙">
        </div>

        <div class="page"><img src="./page2.jpg.JPG" alt="ページ2"></div>
        <div class="page"><img src="./page3.jpg.JPG" alt="ページ3"></div>
        <div class="page"><img src="./page4.jpg.JPG" alt="ページ4"></div>
        <div class="page"><img src="./page5.jpg.JPG" alt="ページ5"></div>
        <div class="page"><img src="./page6.jpg.JPG" alt="ページ6"></div>
        <div class="page"><img src="./page7.jpg.JPG" alt="ページ7"></div>
        <div class="page"><img src="./page8.jpg.JPEG" alt="ページ8"></div>
        <div class="page"><img src="./page9.jpg.JPG" alt="ページ9"></div>
        <div class="page"><img src="./page10.jpg.JPG" alt="ページ10"></div>
        <div class="page"><img src="./page11.jpg.JPG" alt="ページ11"></div>
        <div class="page"><img src="./page12.jpg.JPG" alt="ページ12"></div>
        <div class="page"><img src="./page13.jpg.JPG" alt="ページ13"></div>

        <div class="page" data-density="hard">
          <img src="./page14.jpg.JPG" alt="裏表紙">
        </div>

      </div>
    </div>
  </section>

  <!-- 音楽ボタン -->
  <button id="music-button" aria-label="音楽プレイヤーを開く" title="Music">
    ♫
  </button>

  <!-- 音楽プレイヤー -->
  <div id="music-panel">
    <div id="music-panel-header">
      <span>♫ Birthday music</span>
      <button id="music-close" aria-label="閉じる">×</button>
    </div>

    <iframe
      id="music-player"
      title="Apple Music"
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
      loading="eager"
    ></iframe>
  </div>

  <script>
    const envelopeScreen =
      document.getElementById("envelope-screen");

    const envelopeButton =
      document.getElementById("envelope-button");

    const bookScreen =
      document.getElementById("book-screen");

    const musicButton =
      document.getElementById("music-button");

    const musicPanel =
      document.getElementById("music-panel");

    const musicClose =
      document.getElementById("music-close");

    const musicPlayer =
      document.getElementById("music-player");

    const backgroundVideo =
      document.getElementById("background-video");

    const passcodeScreen =
      document.getElementById("passcode-screen");

    const passcodeDots =
      document.getElementById("passcode-dots");

    const passcodeError =
      document.getElementById("passcode-error");

    const deleteDigitButton =
      document.getElementById("delete-digit");

    const keys =
      document.querySelectorAll("[data-digit]");

    const correctPasscode = "1225";
    let enteredPasscode = "";
    let pageFlip = null;
    let musicLoaded = false;
    let opening = false;
    let unlocked = false;

    const musicURL =
      "https://embed.music.apple.com/jp/album/joyride/1831921913?i=1831921929&autoplay=1";

    function playBackground() {
      backgroundVideo.muted = true;
      backgroundVideo.play().catch(() => {});
    }

    window.addEventListener("load", playBackground);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) playBackground();
    });

    /*
      パスコードの入力ドットを更新
    */
    function updateDots() {
      const dots =
        passcodeDots.querySelectorAll(".passcode-dot");

      dots.forEach((dot, index) => {
        dot.classList.toggle(
          "filled",
          index < enteredPasscode.length
        );
      });
    }

    /*
      正しいパスコードなら封筒を表示
    */
    function unlockScreen() {
      if (unlocked) return;
      unlocked = true;

      passcodeError.classList.remove("show");
      passcodeScreen.classList.add("unlocked");

      setTimeout(() => {
        passcodeScreen.style.display = "none";
        envelopeScreen.classList.add("visible");
      }, 650);
    }

    /*
      パスコードを判定
    */
    function checkPasscode() {
      if (enteredPasscode.length !== 4) return;

      if (enteredPasscode === correctPasscode) {
        unlockScreen();
      } else {
        passcodeError.classList.add("show");
        passcodeDots.classList.remove("shake");

        // アニメーションを再実行
        void passcodeDots.offsetWidth;
        passcodeDots.classList.add("shake");

        enteredPasscode = "";
        updateDots();

        setTimeout(() => {
          passcodeError.classList.remove("show");
        }, 1800);
      }
    }

    /*
      数字ボタン
    */
    keys.forEach((key) => {
      key.addEventListener("click", () => {
        if (unlocked || enteredPasscode.length >= 4) return;

        enteredPasscode += key.dataset.digit;
        updateDots();

        if (enteredPasscode.length === 4) {
          // 最後のドットが見えてから判定
          setTimeout(checkPasscode, 180);
        }
      });
    });

    /*
      1桁削除
    */
    deleteDigitButton.addEventListener("click", () => {
      if (unlocked) return;

      enteredPasscode = enteredPasscode.slice(0, -1);
      updateDots();
      passcodeError.classList.remove("show");
    });

    /*
      音楽プレイヤーは一度だけ読み込む
    */
    function loadMusic() {
      if (musicLoaded) return;

      musicPlayer.src = musicURL;
      musicLoaded = true;
    }

    function updateCoverPosition(pageIndex) {
      bookScreen.classList.remove("front-cover", "back-cover");

      if (pageIndex === 0) {
        bookScreen.classList.add("front-cover");
      } else if (pageIndex === 13) {
        bookScreen.classList.add("back-cover");
      }
    }

    /*
      封筒を開いて本を表示
    */
    function openBook() {
      if (opening) return;
      opening = true;

      loadMusic();
      envelopeScreen.classList.add("opening");

      setTimeout(() => {
        envelopeScreen.style.display = "none";
        bookScreen.style.display = "flex";

        requestAnimationFrame(() => {
          bookScreen.classList.add("visible");

          const bookElement =
            document.getElementById("book");

          pageFlip = new St.PageFlip(bookElement, {
            width: 400,
            height: 320,
            size: "stretch",
            minWidth: 100,
            maxWidth: 1000,
            minHeight: 80,
            maxHeight: 800,
            showCover: true,
            usePortrait: false,
            drawShadow: true,
            flippingTime: 800,
            maxShadowOpacity: 0.25,
            mobileScrollSupport: false,
            clickEventForward: true,
            useMouseEvents: true,
            autoSize: false
          });

          pageFlip.loadFromHTML(
            document.querySelectorAll("#book .page")
          );

          updateCoverPosition(0);

          pageFlip.on("flip", (event) => {
            updateCoverPosition(event.data);
          });
        });
      }, 700);
    }

    envelopeButton.addEventListener("click", openBook);

    /* 音楽パネルの表示／非表示 */
    musicButton.addEventListener("click", () => {
      loadMusic();
      musicPanel.classList.toggle("open");
    });

    musicClose.addEventListener("click", () => {
      musicPanel.classList.remove("open");
    });
  </script>

</body>
</html>
