
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Book</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f5efe5;
  font-family: sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}

.app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.hint {
  margin: 0;
  color: #756458;
  font-size: 12px;
}

#book-wrap {
  width: 100%;
  height: calc(100% - 25px);
  display: flex;
  align-items: center;
  justify-content: center;
}

#book {
  box-shadow: 0 12px 35px #6b514533;
}

.page {
  background: #fffdf8;
  overflow: hidden;
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

@media (orientation: portrait) {
  .hint::after {
    content: "（iPhoneを横向きにしてね）";
  }
}
</style>
</head>

<body>
<main class="app">

  <p class="hint">
    ページの端を指でスワイプしてめくってね
  </p>

  <div id="book-wrap">
    <div id="book">

      <!-- Canvaで作った画像を順番に配置 -->
      <div class="page">
        <img src="page1.jpg" alt="1ページ目">
      </div>

      <div class="page">
        <img src="page2.jpg" alt="2ページ目">
      </div>

      <div class="page">
        <img src="page3.jpg" alt="3ページ目">
      </div>

      <div class="page">
        <img src="page4.jpg" alt="4ページ目">
      </div>

      <div class="page">
        <img src="page5.jpg" alt="5ページ目">
      </div>

      <div class="page">
        <img src="page6.jpg" alt="6ページ目">
      </div>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>
window.addEventListener("load", () => {
  const book = document.getElementById("book");
  const wrap = document.getElementById("book-wrap");

  if (!window.St || !window.St.PageFlip) {
    document.querySelector(".hint").textContent =
      "本を読み込めませんでした。通信環境を確認してね。";
    return;
  }

  // 1ページは2000×1600px。
  // 見開き全体は横長になるので、画面内に収める。
  const pageRatio = 2000 / 1600;
  const spreadRatio = pageRatio * 2;

  const availableWidth = wrap.clientWidth;
  const availableHeight = wrap.clientHeight;

  const spreadWidth = Math.min(
    availableWidth,
    availableHeight * spreadRatio
  );

  const spreadHeight = spreadWidth / spreadRatio;

  book.style.width = spreadWidth + "px";
  book.style.height = spreadHeight + "px";

  const pageFlip = new St.PageFlip(book, {
    width: 400,
    height: 320,
    size: "stretch",
    minWidth: 200,
    maxWidth: 1600,
    minHeight: 160,
    maxHeight: 1280,

    usePortrait: false,
    showCover: false,
    startPage: 0,

    drawShadow: true,
    maxShadowOpacity: 0.3,
    flippingTime: 850,

    mobileScrollSupport: false,
    swipeDistance: 20,
    useMouseEvents: true
  });

  pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
  );
});
</script>

</body>
</html>
