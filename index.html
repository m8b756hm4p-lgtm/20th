<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Birthday Book</title>

<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at center, #faf8f4 0%, #e5dfd6 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

/* =========================
   BOOK
========================= */

.book {
  position: relative;

  width: min(92vw, 820px);
  aspect-ratio: 2 / 1;

  perspective: 2200px;
  transform-style: preserve-3d;
}

/* =========================
   BASE PAGES
========================= */

.base-page {
  position: absolute;

  top: 0;

  width: 50%;
  height: 100%;

  overflow: hidden;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.07),
      transparent 12%,
      transparent 88%,
      rgba(0,0,0,.035)
    ),
    #fffdf9;

  box-shadow:
    0 12px 35px rgba(0,0,0,.18);
}

.left-page {
  left: 0;

  border-radius: 12px 0 0 12px;
}

.right-page {
  right: 0;

  border-radius: 0 12px 12px 0;
}

/* 本の中央部分 */
.book::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 0;

  width: 3px;
  height: 100%;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.12),
      rgba(255,255,255,.7),
      rgba(0,0,0,.08)
    );

  opacity: .55;

  z-index: 8;

  pointer-events: none;
}

/* =========================
   MOVING PAPER
========================= */

.turn-page {
  position: absolute;

  left: 50%;
  top: 0;

  width: 50%;
  height: 100%;

  transform-origin: left center;

  transform-style: preserve-3d;

  z-index: 20;

  touch-action: none;

  cursor: grab;

  will-change: transform;

  /* 紙の初期位置 */
  transform:
    rotateY(0deg)
    translateZ(0px)
    scaleX(1);
}

.turn-page.dragging {
  cursor: grabbing;
}

/* =========================
   PAPER FACES
========================= */

.face {
  position: absolute;

  inset: 0;

  overflow: hidden;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.085),
      transparent 14%,
      transparent 82%,
      rgba(0,0,0,.045)
    ),
    #fffdf9;

  backface-visibility: hidden;

  transform-style: preserve-3d;
}

.front {
  border-radius: 0 12px 12px 0;
}

.back {
  transform: rotateY(180deg);

  border-radius: 12px 0 0 12px;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.045),
      transparent 18%,
      transparent 88%,
      rgba(0,0,0,.09)
    ),
    #fffdf9;
}

/* =========================
   PAPER TEXTURE
========================= */

.face::before {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: .13;

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.025) 0px,
      rgba(0,0,0,.025) 1px,
      transparent 1px,
      transparent 4px
    );
}

/* =========================
   PAGE CONTENT
========================= */

.text {
  position: absolute;

  inset: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  text-align: center;

  padding: 20px;

  font-size: clamp(18px, 4vw, 32px);

  line-height: 1.6;

  color: #555;

  pointer-events: none;
}

/* =========================
   PAGE EDGE
========================= */

.turn-page::after {
  content: "";

  position: absolute;

  top: 0;
  right: -2px;

  width: 4px;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.12),
      rgba(255,255,255,.8),
      rgba(0,0,0,.12)
    );

  opacity: .7;

  pointer-events: none;
}

/* =========================
   MOVING SHADOW
========================= */

.page-shadow {
  position: absolute;

  left: 50%;
  top: 3%;

  width: 48%;
  height: 94%;

  z-index: 12;

  pointer-events: none;

  background: rgba(0,0,0,.22);

  filter: blur(18px);

  opacity: 0;

  transform-origin: left center;

  will-change: transform, opacity;
}

/* =========================
   LITTLE HINT
========================= */

.hint {
  position: fixed;

  bottom: 25px;
  left: 0;
  right: 0;

  text-align: center;

  color: rgba(0,0,0,.42);

  font-size: 13px;

  pointer-events: none;

  transition: opacity .5s ease;
}

.hint.hide {
  opacity: 0;
}
</style>
</head>


<body>

<div class="book">

  <!-- 左ページ -->
  <div class="base-page left-page">

    <div class="text">
      Birthday Book
    </div>

  </div>


  <!-- 右ページ -->
  <div class="base-page right-page"></div>


  <!-- ページの影 -->
  <div
    class="page-shadow"
    id="pageShadow">
  </div>


  <!-- 実際に動く紙 -->
  <div
    class="turn-page"
    id="turnPage">

    <!-- 表 -->
    <div class="face front">

      <div class="text">
        指で紙をつかんで<br>
        左へ動かしてみてね
      </div>

    </div>


    <!-- 裏 -->
    <div class="face back">

      <div class="text">
        右へ戻してみてね
      </div>

    </div>

  </div>

</div>


<div
  class="hint"
  id="hint">
  ページを指でドラッグしてみてね
</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const page =
  document.getElementById("turnPage");

const shadow =
  document.getElementById("pageShadow");

const hint =
  document.getElementById("hint");


/* =====================================================
   STATE
===================================================== */

let dragging = false;

let startX = 0;

let startAngle = 0;

let currentAngle = 0;

let pointerId = null;


/* =====================================================
   GET POINTER X
===================================================== */

function getX(e) {

  if (
    e.touches &&
    e.touches.length
  ) {
    return e.touches[0].clientX;
  }

  return e.clientX;
}


/* =====================================================
   CLAMP
===================================================== */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* =====================================================
   UPDATE PAGE
===================================================== */

function updatePage(angle) {

  angle =
    clamp(
      angle,
      -180,
      0
    );


  currentAngle =
    angle;


  /*
    0〜1に変換
  */

  const progress =
    Math.abs(angle) / 180;


  /*
    紙が中央付近で
    少しだけしなる
  */

  const bend =
    Math.sin(
      progress * Math.PI
    );


  /*
    奥行き
  */

  const depth =
    bend * 10;


  /*
    横方向の縮み
  */

  const scaleX =
    1 -
    bend * 0.035;


  /*
    紙の回転
  */

  page.style.transform =
    `
      rotateY(${angle}deg)
      translateZ(${depth}px)
      scaleX(${scaleX})
    `;


  /*
    ページの影
  */

  const shadowOpacity =
    bend * .55;


  shadow.style.opacity =
    shadowOpacity;


  /*
    影もページの動きに合わせる
  */

  const shadowRotate =
    angle * .48;


  const shadowScale =
    1 +
    bend * .25;


  shadow.style.transform =
    `
      rotateY(${shadowRotate}deg)
      scaleX(${shadowScale})
    `;

}


/* =====================================================
   POINTER DOWN
===================================================== */

page.addEventListener(
  "pointerdown",
  function(e) {

    dragging = true;

    pointerId =
      e.pointerId;

    page.classList.add(
      "dragging"
    );


    /*
      今の角度を基準にする
    */

    startAngle =
      currentAngle;


    startX =
      getX(e);


    /*
      アニメーション解除
    */

    page.style.transition =
      "none";


    /*
      iPhone / PC
    */

    try {

      page.setPointerCapture(
        e.pointerId
      );

    } catch (_) {}


    /*
      ヒントを消す
    */

    hint.classList.add(
      "hide"
    );

  }
);


/* =====================================================
   POINTER MOVE
===================================================== */

page.addEventListener(
  "pointermove",
  function(e) {

    if (!dragging) {
      return;
    }


    const x =
      getX(e);


    /*
      指の移動距離
    */

    const distance =
      x - startX;


    /*
      1px → 0.9度
    */

    const angle =
      startAngle +
      distance * .9;


    /*
      リアルタイム更新
    */

    updatePage(
      angle
    );

  }
);


/* =====================================================
   RELEASE
===================================================== */

function releasePage() {

  if (!dragging) {
    return;
  }


  dragging = false;

  page.classList.remove(
    "dragging"
  );


  /*
    半分以上なら
    最後までめくる
  */

  const shouldFlip =
    Math.abs(currentAngle) > 90;


  page.style.transition =
    `
      transform
      .48s
      cubic-bezier(
        .22,
        .61,
        .36,
        1
      )
    `;


  if (shouldFlip) {

    updatePage(
      -180
    );

  } else {

    updatePage(
      0
    );

  }


  /*
    アニメーション終了後
    transitionを解除
  */

  setTimeout(
    function() {

      page.style.transition =
        "";

    },
    520
  );

}


/* =====================================================
   POINTER UP
===================================================== */

page.addEventListener(
  "pointerup",
  releasePage
);

page.addEventListener(
  "pointercancel",
  releasePage
);


/* =====================================================
   TOUCH MOVE
===================================================== */

page.addEventListener(
  "touchmove",
  function(e) {

    if (dragging) {

      e.preventDefault();

    }

  },
  {
    passive: false
  }
);


/* =====================================================
   INITIAL
===================================================== */

updatePage(
  0
);

</script>

</body>
</html>
