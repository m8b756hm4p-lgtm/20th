
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #18131c;
    }

    /* 背景動画 */
    #background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #18131c;
    }

    /* 動画の上にかける薄いフィルター */
    #background-shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(20, 10, 25, 0.2);
    }

    /* 封筒の画面 */
    #envelope-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 24px;
      transition: opacity 0.8s ease;
    }

    #envelope-screen p {
      color: white;
      font-size: 14px;
      letter-spacing: 0.15em;
      text-shadow: 0 2px 8px #000;
    }

    #envelope-button {
      display: block;
      width: min(75vw, 340px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      animation: float 2.5s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent;
    }

    #envelope-button img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.25));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #envelope-screen.opening {
      opacity: 0;
      pointer-events: none;
    }

    /* 本の画面 */
    #book-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #book-screen.visible {
      opacity: 1;
    }

    #book {
      width: min(96vw, 900px);
      height: min(48vh, 360px);
      margin: 0 auto;
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 小さな音楽ボタン */
    #music-button {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 10;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 50%;
      color: white;
      background: rgba(30, 20, 35, 0.55);
      backdrop-filter: blur(8px);
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }

    /* ボタンを押したときだけ出る音楽パネル */
    #music-panel {
      position: fixed;
      right: 12px;
      bottom: 72px;
      z-index: 11;
      width: min(340px, calc(100vw - 24px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 5px 24px rgba(0,0,0,0.25);
      display: none;
    }

    #music-panel.open {
      display: block;
    }

    #music-panel p {
      margin: 0 0 8px;
      color: #514455;
      font-size: 12px;
    }

    #music-player {
      display: block;
      width: 100%;
      height: 150px;
      border: 0;
      border-radius: 8px;
    }

    /* スマホ向け */
    @media (max-height: 500px) {
      #book {
        height: 65vh;
      }

      #envelope-button {
        width: min(45vw, 250px);
      }
    }
  </style>
</head>

<body>

  <!-- 背景動画：index.html と同じ階層に置く -->
  <video id="background-video" autoplay muted loop playsinline>
    <source src="./background.mp4.MP4" type="video/mp4">
  </video>
  <div id="background-shade"></div>

  <!-- 封筒 -->
  <section id="envelope-screen">
    <button id="envelope-button" aria-label="手紙を開く">
      <img
        src="./envelope.png.PNG"
        alt="封筒"
        onerror="this.style.display='none'; document.getElementById('envelope-error').style.display='block';"
      >
    </button>

    <p>Tap to open</p>
    <p id="envelope-error" style="display:none;">
      封筒の画像が読み込めません。envelope.png の名前と場所を確認してね。
    </p>
  </section>

  <!-- 本 -->
  <section id="book-screen">
    <div id="book">

      <div class="page" data-density="hard">
        <img src="./page1.jpg" alt="表紙">
      </div>

      <div class="page"><img src="./page2.jpg" alt="ページ2"></div>
      <div class="page"><img src="./page3.jpg" alt="ページ3"></div>
      <div class="page"><img src="./page4.jpg" alt="ページ4"></div>
      <div class="page"><img src="./page5.jpg" alt="ページ5"></div>
      <div class="page"><img src="./page6.jpg" alt="ページ6"></div>
      <div class="page"><img src="./page7.jpg" alt="ページ7"></div>
      <div class="page"><img src="./page8.jpg" alt="ページ8"></div>
      <div class="page"><img src="./page9.jpg" alt="ページ9"></div>
      <div class="page"><img src="./page10.jpg" alt="ページ10"></div>
      <div class="page"><img src="./page11.jpg" alt="ページ11"></div>
      <div class="page"><img src="./page12.jpg" alt="ページ12"></div>
      <div class="page"><img src="./page13.jpg" alt="ページ13"></div>

      <div class="page" data-density="hard">
        <img src="./page14.jpg" alt="裏表紙">
      </div>

    </div>
  </section>

  <!-- 小さな音楽ボタン -->
  <button id="music-button" aria-label="音楽を表示" title="Music">♫</button>

  <!-- ボタンを押すと表示 -->
  <div id="music-panel">
    <p>🎵 Birthday music</p>
    <iframe
      id="music-player"
      title="Apple Music"
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
      loading="eager"
    ></iframe>
  </div>

  <script>
    const envelopeScreen = document.getElementById("envelope-screen");
    const envelopeButton = document.getElementById("envelope-button");
    const bookScreen = document.getElementById("book-screen");
    const musicButton = document.getElementById("music-button");
    const musicPanel = document.getElementById("music-panel");
    const musicPlayer = document.getElementById("music-player");
    const backgroundVideo = document.getElementById("background-video");

    let pageFlip = null;
    let musicLoaded = false;

    // iPhoneで背景動画の再生を試す
    function playBackground() {
      backgroundVideo.muted = true;
      backgroundVideo.play().catch(() => {});
    }

    window.addEventListener("load", playBackground);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) playBackground();
    });

    // 封筒をタップ
    envelopeButton.addEventListener("click", () => {
      if (pageFlip) return;

      // 音楽の読み込み・自動再生を試す
      if (!musicLoaded) {
        musicPlayer.src =
          "https://embed.music.apple.com/jp/album/joyride/1831921913?i=1831921929&autoplay=1";
        musicLoaded = true;
      }

      envelopeScreen.classList.add("opening");

      setTimeout(() => {
        envelopeScreen.style.display = "none";
        bookScreen.style.display = "flex";

        requestAnimationFrame(() => {
          bookScreen.classList.add("visible");

          const bookElement = document.getElementById("book");

          pageFlip = new St.PageFlip(bookElement, {
            width: 400,
            height: 320,
            size: "stretch",
            minWidth: 150,
            maxWidth: 1000,
            minHeight: 120,
            maxHeight: 800,
            showCover: true,
            usePortrait: false,
            drawShadow: true,
            flippingTime: 800,
            maxShadowOpacity: 0.25,
            mobileScrollSupport: false,
            clickEventForward: true,
            useMouseEvents: true
          });

          pageFlip.loadFromHTML(
            document.querySelectorAll("#book .page")
          );
        });
      }, 700);
    });

    // 音楽パネルを表示／非表示
    musicButton.addEventListener("click", () => {
      if (!musicLoaded) {
        musicPlayer.src =
          "https://embed.music.apple.com/jp/album/joyride/1831921913?i=1831921929";
        musicLoaded = true;
      }

      musicPanel.classList.toggle("open");
    });
  </script>

</body>
</html>
