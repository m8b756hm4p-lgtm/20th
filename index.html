
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#18131c">
  <title>Happy Birthday</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #18131c;
      font-family: sans-serif;
    }

    /* 背景動画 */
    #background-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #18131c;
    }

    #background-shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(20, 10, 25, 0.2);
      pointer-events: none;
    }

    /* 封筒画面 */
    #envelope-screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      padding: 24px;
      transition: opacity 0.7s ease;
    }

    #envelope-screen.opening {
      opacity: 0;
      pointer-events: none;
    }

    #envelope-button {
      display: block;
      width: min(75vw, 340px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: float 2.5s ease-in-out infinite;
    }

    #envelope-button img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
    }

    #envelope-caption {
      margin: 0;
      color: white;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-shadow: 0 2px 8px #000;
    }

    #envelope-error {
      display: none;
      max-width: 300px;
      color: white;
      font-size: 13px;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    /* 本の画面 */
    #book-screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 12px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #book-screen.visible {
      opacity: 1;
    }

    /*
      見開き時の表示領域。
      表紙・裏表紙では位置をずらして、
      1枚のページが画面中央に来るようにする。
    */
    #book-frame {
      position: relative;
      flex: 0 0 auto;
      width: min(96vw, 900px, 120vh);
      aspect-ratio: 2.5 / 1;
      max-height: 48vh;
      transition: transform 0.55s ease;
    }

    #book {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0 auto;
    }

    #book .page {
      background: #fff;
      overflow: hidden;
    }

    #book .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #book .stf__parent {
      margin: 0 auto !important;
    }

    /*
      表紙は右側にあるため、本の表示全体を左へ。
      裏表紙は左側にあるため、右へ。
      これで1枚のページが中央に近づく。
    */
    #book-screen.front-cover #book-frame {
      transform: translateX(calc(min(96vw, 900px, 120vh) / -4));
    }

    #book-screen.back-cover #book-frame {
      transform: translateX(calc(min(96vw, 900px, 120vh) / 4));
    }

    /* 小さな音楽ボタン */
    #music-button {
      position: fixed;
      right: 16px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 10;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      color: white;
      background: rgba(35, 25, 40, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
      -webkit-tap-highlight-color: transparent;
    }

    /* 音楽プレイヤー */
    #music-panel {
      position: fixed;
      right: 12px;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 11;
      width: min(340px, calc(100vw - 24px));
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.25);
      display: none;
    }

    #music-panel.open {
      display: block;
    }

    #music-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #514455;
      font-size: 13px;
    }

    #music-close {
      border: none;
      background: transparent;
      color: #514455;
      font-size: 20px;
      cursor: pointer;
    }

    #music-player {
      display: block;
      width: 100%;
      height: 150px;
      border: 0;
      border-radius: 8px;
    }

    @media (max-height: 500px) {
      #book-frame {
        width: min(96vw, 130vh, 900px);
        max-height: 70vh;
      }

      #envelope-button {
        width: min(45vw, 250px);
      }
    }
  </style>
</head>

<body>

  <!-- 背景動画 -->
  <video id="background-video" autoplay muted loop playsinline>
    <source src="./background.mp4.MP4" type="video/mp4">
  </video>

  <div id="background-shade"></div>

  <!-- 封筒 -->
  <section id="envelope-screen">
    <button id="envelope-button" aria-label="手紙を開く">
      <img
        src="./envelope.png.PNG"
        alt="封筒"
        onerror="this.style.display='none'; document.getElementById('envelope-error').style.display='block';"
      >
    </button>

    <p id="envelope-caption">Tap to open</p>

    <p id="envelope-error">
      封筒画像を読み込めません。
      GitHub上のファイル名を確認してください。
    </p>
  </section>

  <!-- 本 -->
  <section id="book-screen">
    <div id="book-frame">
      <div id="book">

        <div class="page" data-density="hard">
          <img src="./page1.jpg.JPG" alt="表紙">
        </div>

        <div class="page"><img src="./page2.jpg.JPG" alt="ページ2"></div>
        <div class="page"><img src="./page3.jpg.JPG" alt="ページ3"></div>
        <div class="page"><img src="./page4.jpg.JPG" alt="ページ4"></div>
        <div class="page"><img src="./page5.jpg.JPG" alt="ページ5"></div>
        <div class="page"><img src="./page6.jpg.JPG" alt="ページ6"></div>
        <div class="page"><img src="./page7.jpg.JPG" alt="ページ7"></div>
        <div class="page"><img src="./page8.jpg.JPG" alt="ページ8"></div>
        <div class="page"><img src="./page9.jpg.JPG" alt="ページ9"></div>
        <div class="page"><img src="./page10.jpg.JPG" alt="ページ10"></div>
        <div class="page"><img src="./page11.jpg.JPG" alt="ページ11"></div>
        <div class="page"><img src="./page12.jpg.JPG" alt="ページ12"></div>
        <div class="page"><img src="./page13.jpg.JPG" alt="ページ13"></div>

        <div class="page" data-density="hard">
          <img src="./page14.jpg.JPG" alt="裏表紙">
        </div>

      </div>
    </div>
  </section>

  <!-- 音楽ボタン -->
  <button id="music-button" aria-label="音楽プレイヤーを開く" title="Music">
    ♫
  </button>

  <!-- 音楽プレイヤー -->
  <div id="music-panel">
    <div id="music-panel-header">
      <span>♫ Birthday music</span>
      <button id="music-close" aria-label="閉じる">×</button>
    </div>

    <iframe
      id="music-player"
      title="Apple Music"
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
      loading="eager"
    ></iframe>
  </div>

  <script>
    const envelopeScreen =
      document.getElementById("envelope-screen");

    const envelopeButton =
      document.getElementById("envelope-button");

    const bookScreen =
      document.getElementById("book-screen");

    const bookFrame =
      document.getElementById("book-frame");

    const musicButton =
      document.getElementById("music-button");

    const musicPanel =
      document.getElementById("music-panel");

    const musicClose =
      document.getElementById("music-close");

    const musicPlayer =
      document.getElementById("music-player");

    const backgroundVideo =
      document.getElementById("background-video");

    let pageFlip = null;
    let musicLoaded = false;
    let opening = false;

    const musicURL =
      "https://embed.music.apple.com/jp/album/joyride/1831921913?i=1831921929&autoplay=1";

    function playBackground() {
      backgroundVideo.muted = true;
      backgroundVideo.play().catch(() => {});
    }

    window.addEventListener("load", playBackground);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) playBackground();
    });

    /*
      音楽プレイヤーは一度だけ読み込む。
      本の画面に切り替わっても再読み込みしない。
    */
    function loadMusic() {
      if (musicLoaded) return;

      musicPlayer.src = musicURL;
      musicLoaded = true;
    }

    function updateCoverPosition(pageIndex) {
      bookScreen.classList.remove("front-cover", "back-cover");

      if (pageIndex === 0) {
        bookScreen.classList.add("front-cover");
      } else if (pageIndex === 13) {
        bookScreen.classList.add("back-cover");
      }
    }

    function openBook() {
      if (opening) return;
      opening = true;

      // 封筒をタップした時点で音楽を読み込む
      loadMusic();

      envelopeScreen.classList.add("opening");

      setTimeout(() => {
        envelopeScreen.style.display = "none";
        bookScreen.style.display = "flex";

        requestAnimationFrame(() => {
          bookScreen.classList.add("visible");

          const bookElement =
            document.getElementById("book");

          pageFlip = new St.PageFlip(bookElement, {
            width: 400,
            height: 320,
            size: "stretch",
            minWidth: 100,
            maxWidth: 1000,
            minHeight: 80,
            maxHeight: 800,
            showCover: true,
            usePortrait: false,
            drawShadow: true,
            flippingTime: 800,
            maxShadowOpacity: 0.25,
            mobileScrollSupport: false,
            clickEventForward: true,
            useMouseEvents: true,
            autoSize: false
          });

          pageFlip.loadFromHTML(
            document.querySelectorAll("#book .page")
          );

          // 最初は表紙を中央寄せ
          updateCoverPosition(0);

          // ページが変わるたびに位置を調整
          pageFlip.on("flip", (event) => {
            updateCoverPosition(event.data);
          });
        });
      }, 700);
    }

    envelopeButton.addEventListener("click", openBook);

    // 音楽パネルの表示／非表示
    musicButton.addEventListener("click", () => {
      loadMusic();
      musicPanel.classList.toggle("open");
    });

    musicClose.addEventListener("click", () => {
      musicPanel.classList.remove("open");
    });
  </script>

</body>
</html>
