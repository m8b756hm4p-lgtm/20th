<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Birthday Book</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(
      circle,
      #fffdf9 0%,
      #e8e1d8 100%
    );

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

/* 本の入れ物 */
#book {
  width: 92vw;
  max-width: 850px;
  height: 70vh;
  max-height: 600px;
}

/* ページ */
.page {
  background: #fffdf9;

  color: #555;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  overflow: hidden;

  box-shadow:
    0 4px 18px rgba(0,0,0,.12);
}

/* ページの中身 */
.page-content {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;

  font-size: clamp(
    18px,
    4vw,
    32px
  );

  line-height: 1.6;
}

/* Canva画像を入れる場合 */
.page-content img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}
</style>

<!-- ページめくりライブラリ -->
<script
  src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>

</head>

<body>

<div id="book">

  <!-- 表紙 -->
  <div class="page" data-density="hard">

    <div class="page-content">
      🎂<br>
      Birthday Book
    </div>

  </div>


  <!-- 1ページ -->
  <div class="page">

    <div class="page-content">
      ここから<br>
      大切なページ
    </div>

  </div>


  <!-- 2ページ -->
  <div class="page">

    <div class="page-content">
      指でページを<br>
      めくってみてね
    </div>

  </div>


  <!-- 3ページ -->
  <div class="page">

    <div class="page-content">
      Happy Birthday!
    </div>

  </div>


  <!-- 最後 -->
  <div class="page" data-density="hard">

    <div class="page-content">
      FIN
    </div>

  </div>

</div>


<script>

const book =
  document.getElementById("book");


const pageFlip =
  new St.PageFlip(
    book,
    {

      /* 基準サイズ */
      width: 400,
      height: 560,

      /* 画面に合わせて伸縮 */
      size: "stretch",

      minWidth: 280,
      maxWidth: 800,

      minHeight: 390,
      maxHeight: 650,

      /* 本を中央に合わせる */
      autoSize: true,

      /* 表紙あり */
      showCover: true,

      /* 紙を柔らかくする */
      mobileScrollSupport: false,

      /* 指・マウス操作 */
      useMouseEvents: true,

      /* ページをめくる速度 */
      flippingTime: 850,

      /* ページの影 */
      drawShadow: true,

      /* 影の濃さ */
      maxShadowOpacity: 0.45,

      /* クリックだけで勝手にめくらない */
      disableFlipByClick: true,

      /* スマホでの最低ドラッグ距離 */
      swipeDistance: 20

    }
  );


/*
  HTMLページを読み込む
*/
pageFlip.loadFromHTML(
  document.querySelectorAll(".page")
);


/*
  ページ番号を確認
*/
pageFlip.on(
  "flip",
  function(e) {

    console.log(
      "現在のページ:",
      e.data
    );

  }
);

</script>

</body>
</html>
